# CodeRabbit Configuration
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en-US"

# Review settings
reviews:
  # Auto-review all PRs
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # What to review
  auto_review:
    enabled: true
    drafts: false         # Skip draft PRs
    base_branches:
      - main
      - master
      - develop

  # Path filters — ignore generated/build files
  path_filters:
    - "!dist/**"
    - "!build/**"
    - "!node_modules/**"
    - "!*.lock"
    - "!*.min.js"
    - "!*.min.css"

# Chat settings — lets you interact with CodeRabbit in PR comments
chat:
  auto_reply: true
